[package]
name = "cctree"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yenchiugu/cctree"

[dependencies]
sysinfo = "0.39.6"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Globalization"] }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
